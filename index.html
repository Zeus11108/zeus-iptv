
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>ZEUS IPTV</title>
<style>
:root {
  --bg:#090909;
  --gold:#d6ad55;
  --gold2:#f1d58c;
  --muted:#999;
  --line:#30291d;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at 75% -15%,#493617 0,transparent 34%),var(--bg);
  color:#f7f4ed;
  font:16px Arial,sans-serif;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
header{
  height:72px;padding:0 4vw;display:flex;
  align-items:center;justify-content:space-between;
  border-bottom:1px solid #30291d;
  background:#090909;position:sticky;top:0;z-index:5;
}
.brand{font-size:27px;font-weight:900;letter-spacing:5px;color:var(--gold2)}
.brand span{color:white;font-weight:400;letter-spacing:1px}
main{max-width:1450px;margin:auto;padding:34px 4vw 70px}
.eyebrow{color:var(--gold);font-size:11px;font-weight:bold;letter-spacing:2.5px}
h1{font-size:clamp(32px,5vw,55px);margin:12px 0}
h2{font-size:24px;margin:8px 0}
h3{font-size:12px;letter-spacing:2px;color:var(--gold2);margin:0 0 15px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}
.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:24px}
.nav button,.ghost{
  padding:11px 17px;border:1px solid transparent;border-radius:8px;
  background:#1b1b1b;color:#aaa;font-size:12px;font-weight:bold;letter-spacing:1px;
}
.nav button.active{color:var(--gold2);border-color:#725a2b;background:#d6ad5512}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}
.side,.content{
  background:linear-gradient(145deg,#171717,#101010);
  border:1px solid #292929;border-radius:14px;padding:18px;min-height:360px;
}
.cats{display:grid;gap:7px}
.cat{
  padding:11px;text-align:left;background:#202020;
  border:1px solid transparent;border-radius:7px;color:#ddd;font-size:13px;
}
.cat.active{border-color:#80642f;color:var(--gold2)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #39352d;background:#090909;color:white}
.search{max-width:330px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.item{border:1px solid #303030;background:#191919;color:white;border-radius:10px;overflow:hidden;text-align:left;padding:0}
.poster{
  aspect-ratio:2/2.8;background:linear-gradient(145deg,#322a1b,#111);
  display:grid;place-items:center;color:var(--gold);font-size:34px;
}
.poster img{width:100%;height:100%;object-fit:cover}
.name{padding:10px 10px 3px;font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{padding:0 10px 10px;color:#999;font-size:10px}
.empty{color:#999;padding:20px 0;font-size:14px}
#player{
  position:fixed;inset:0;background:#000e;z-index:10;
  display:grid;place-items:center;padding:20px;
}
.playerbox{width:min(1000px,100%);background:#111;border:1px solid #705727;border-radius:14px;padding:16px}
video{width:100%;max-height:70vh;background:#000}
.playerhead{display:flex;justify-content:space-between;margin-bottom:12px}
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .top{align-items:flex-start;flex-direction:column}
  .toolbar{align-items:stretch;flex-direction:column}
  .search{max-width:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">ZEUS <span>IPTV</span></div>
  <div class="eyebrow" id="state">PREMIUM ENTERTAINMENT</div>
</header>

<main>
<section id="app">
  <div class="top">
    <div>
      <div class="eyebrow">YOUR ENTERTAINMENT HUB</div>
      <h1>Welcome to <span style="color:var(--gold2)">ZEUS</span>.</h1>
      <div class="muted" id="account">Connecting securely...</div>
    </div>
    <button class="ghost" id="logout">RECONNECT</button>
  </div>

  <nav class="nav">
    <button data-kind="live" class="active">LIVE TV</button>
    <button data-kind="movie">MOVIES</button>
    <button data-kind="series">SERIES</button>
  </nav>

  <div class="toolbar">
    <div>
      <div class="eyebrow" id="section">LIVE CHANNELS</div>
      <h2 id="heading">Explore Live TV</h2>
    </div>
    <input id="search" class="search" placeholder="Search...">
  </div>

  <div class="layout">
    <aside class="side">
      <h3>CATEGORIES</h3>
      <div id="categories" class="cats">
        <div class="empty">Loading...</div>
      </div>
    </aside>
    <section class="content">
      <h3 id="itemsTitle">SELECT A CATEGORY</h3>
      <div id="items" class="grid">
        <div class="empty">Choose a category.</div>
      </div>
    </section>
  </div>
</section>
</main>

<div id="player" class="hidden">
  <div class="playerbox">
    <div class="playerhead">
      <strong id="playing">NOW PLAYING</strong>
      <button class="ghost" id="close">CLOSE ✕</button>
    </div>
    <video id="video" controls autoplay playsinline></video>
    <p class="muted" id="playerStatus"></p>
  </div>
</div>

<script>
(() => {
"use strict";

const API = "https://zeus-iptv-api.zeyad-lab112005.workers.dev/api";
const $ = id => document.getElementById(id);

let kind = "live";
let current = [];
let cats = [];
let playerStream = null;

const labels = {
  live:["LIVE CHANNELS","Explore Live TV"],
  movie:["MOVIE LIBRARY","Explore Movies"],
  series:["SERIES LIBRARY","Explore Series"]
};

async function call(action, extra = {}) {
  const payload = {...extra};
  if (action) payload.action = action;

  const response = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });

  const data = await response.json().catch(()=>({}));

  if(!response.ok || data.error){
    throw Error(data.error || ("HTTP "+response.status));
  }
  return data;
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function autoConnect(){
  $("state").textContent="CONNECTING";
  $("account").textContent="Connecting securely to ZEUS...";

  try{
    const info = await call(null);

    if(!info.user_info || String(info.user_info.auth)==="0"){
      throw Error("Xtream authentication failed. Check Cloudflare Secrets.");
    }

    if(info.user_info.status &&
       String(info.user_info.status).toLowerCase()!=="active"){
      throw Error("Subscription is not active.");
    }

    $("state").textContent="CONNECTED";
    $("account").textContent="CONNECTED · ZEUS AUTO LOGIN";
    await load("live");

  }catch(error){
    $("state").textContent="CONNECTION ERROR";
    $("account").textContent=error.message;
    $("categories").innerHTML="";
    $("items").innerHTML='<div class="empty">'+escapeHTML(error.message)+'</div>';
  }
}

async function load(section){
  kind=section;

  document.querySelectorAll("[data-kind]").forEach(button=>{
    button.classList.toggle("active",button.dataset.kind===section);
  });

  $("section").textContent=labels[section][0];
  $("heading").textContent=labels[section][1];
  $("categories").innerHTML='<div class="empty">Loading categories...</div>';
  $("items").innerHTML="";
  $("itemsTitle").textContent="SELECT A CATEGORY";

  const action=section==="live"?"get_live_categories":
    section==="movie"?"get_vod_categories":"get_series_categories";

  try{
    cats=await call(action);
    if(!Array.isArray(cats)) throw Error("Unexpected category response.");
    renderCats();
  }catch(error){
    $("categories").innerHTML="";
    $("items").innerHTML='<div class="empty">'+escapeHTML(error.message)+'</div>';
  }
}

function renderCats(){
  $("categories").innerHTML="";

  if(!cats.length){
    $("categories").innerHTML='<div class="empty">No categories found.</div>';
    return;
  }

  cats.forEach(category=>{
    const button=document.createElement("button");
    button.className="cat";
    button.textContent=category.category_name||"Category";
    button.onclick=()=>loadItems(category.category_id,button);
    $("categories").append(button);
  });
}

async function loadItems(id,button){
  document.querySelectorAll(".cat").forEach(item=>item.classList.remove("active"));
  button.classList.add("active");

  $("items").innerHTML='<div class="empty">Loading content...</div>';

  const action=kind==="live"?"get_live_streams":
    kind==="movie"?"get_vod_streams":"get_series";

  try{
    current=await call(action,{category_id:id});
    if(!Array.isArray(current)) throw Error("Unexpected content response.");
    $("itemsTitle").textContent=button.textContent;
    renderItems();
  }catch(error){
    $("items").innerHTML='<div class="empty">'+escapeHTML(error.message)+'</div>';
  }
}

function renderItems(){
  const query=$("search").value.toLowerCase();
  $("items").innerHTML="";

  const filtered=current.filter(item=>
    (item.name||"").toLowerCase().includes(query)
  );

  if(!filtered.length){
    $("items").innerHTML='<div class="empty">No content found.</div>';
    return;
  }

  filtered.forEach(item=>{
    const button=document.createElement("button");
    button.className="item";

    const poster=document.createElement("div");
    poster.className="poster";

    const imageURL=item.stream_icon||item.cover;

    if(imageURL){
      const image=document.createElement("img");
      image.src=imageURL;
      image.loading="lazy";
      image.onerror=()=>{
        image.remove();
        poster.textContent="✦";
      };
      poster.append(image);
    }else{
      poster.textContent=kind==="live"?"▶":"✦";
    }

    const name=document.createElement("div");
    name.className="name";
    name.textContent=item.name||"Untitled";

    const meta=document.createElement("div");
    meta.className="meta";
    meta.textContent=kind==="live"?"LIVE CHANNEL":
      kind==="movie"?"MOVIE":"SERIES";

    button.append(poster,name,meta);
    button.onclick=()=>playItem(item);
    $("items").append(button);
  });
}

async function playItem(item){
  if(kind==="series"){
    await seriesDetails(item);
    return;
  }

  $("playing").textContent=item.name||"ZEUS IPTV";
  $("playerStatus").textContent=
    "The content list is connected. Stream playback requires the secure playback endpoint on the Worker.";
  $("player").classList.remove("hidden");
}

async function seriesDetails(item){
  try{
    const details=await call("get_series_info",{series_id:item.series_id});
    const episodes=Object.values(details.episodes||{}).flat();

    $("items").innerHTML="";
    $("itemsTitle").textContent=(item.name||"SERIES")+" — EPISODES";

    if(!episodes.length){
      $("items").innerHTML='<div class="empty">No episodes returned.</div>';
      return;
    }

    episodes.forEach(episode=>{
      const button=document.createElement("button");
      button.className="item";

      const poster=document.createElement("div");
      poster.className="poster";
      poster.textContent="▶";

      const name=document.createElement("div");
      name.className="name";
      name.textContent=episode.title||episode.episode_num||"Episode";

      const meta=document.createElement("div");
      meta.className="meta";
      meta.textContent="EPISODE";

      button.append(poster,name,meta);
      button.onclick=()=>{
        $("playing").textContent=episode.title||"ZEUS IPTV";
        $("playerStatus").textContent=
          "Episode list connected. Secure playback endpoint is required to play this episode.";
        $("player").classList.remove("hidden");
      };

      $("items").append(button);
    });
  }catch(error){
    $("items").innerHTML='<div class="empty">'+escapeHTML(error.message)+'</div>';
  }
}

document.querySelectorAll("[data-kind]").forEach(button=>{
  button.onclick=()=>{
    $("search").value="";
    load(button.dataset.kind);
  };
});

$("search").addEventListener("input",renderItems);

$("close").onclick=()=>{
  $("video").pause();
  $("video").removeAttribute("src");
  $("player").classList.add("hidden");
};

$("logout").onclick=()=>{
  $("video").pause();
  $("video").removeAttribute("src");
  $("player").classList.add("hidden");
  autoConnect();
};

autoConnect();

})();
</script>
</body>
</html>
